name: Credential hygiene

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-secret-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check published history without uploading it to a scanner
        run: python3 scripts/audit_repository_secrets.py --source history
      - name: Verify credential rules and staged-blob coverage
        run: |
          python3 -m unittest discover -s tests -p test_repository_secret_hygiene.py
          python3 -m unittest discover -s tests -p test_open_source_readiness_audit.py
      - name: Verify dependency declarations and local-artifact exclusions
        run: python3 -m unittest discover -s tests -p test_dependency_hygiene.py
